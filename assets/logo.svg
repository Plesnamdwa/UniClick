<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Ring Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Cursor Accent Gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" filter="url(#shadow)" />

  <!-- Outer Tactical Target Reticle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-dasharray="160 90" stroke-linecap="round" />

  <!-- Inner Precision Ring -->
  <circle cx="256" cy="256" r="100" fill="#090E17" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.5" filter="url(#glow)" />

  <!-- Tactical Crosshair Ticks -->
  <line x1="256" y1="64" x2="256" y2="116" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="448" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <line x1="64" y1="256" x2="116" y2="256" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <line x1="396" y1="256" x2="448" y2="256" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- Center Pulse Target Dot -->
  <circle cx="256" cy="256" r="44" fill="#10B981" fill-opacity="0.15" />
  <circle cx="256" cy="256" r="24" fill="#10B981" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" />

  <!-- Dynamic Cursor Arrow Overlay -->
  <g transform="translate(190, 175) rotate(-18)">
    <path d="M 0 0 L 110 90 L 64 96 L 94 156 L 68 170 L 38 110 L 0 144 Z" 
          fill="url(#cursorGrad)" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linejoin="round"
          filter="url(#shadow)" />
  </g>
</svg>
